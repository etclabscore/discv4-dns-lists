name: Discv4 Crawl and DNS Update
on:
  schedule:
    - cron: '0 */4 * * *'

    # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'etclabscore/discv4-dns-lists'
    name: Discv4-DNS-Crawler
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ETH_DNS_DISCV4_CRAWLTIME: 30m
      ETH_DNS_DISCV4_PARENT_DOMAIN: blockd.info
      ETH_DNS_DISCV4_KEY_PATH: ./secrets/dnskey.json
      ETH_DNS_DISCV4_KEYPASS_PATH: ./secrets/dnskey_password.txt
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ETH_DNS_CLOUDFLARE_ZONEID: ${{ secrets.ETH_DNS_CLOUDFLARE_ZONEID }}
      ETH_DNS_DISCV4_KEY: ${{ secrets.ETH_DNS_DISCV4_KEY }}
      ETH_DNS_DISCV4_KEYPASS: ${{ secrets.ETH_DNS_DISCV4_KEYPASS }}

    steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.22.4
        cache: false
      id: go

    - run: go version

    - run: sudo apt-get install -y jq

    - name: Check out code
      uses: actions/checkout@v5
      with:
        ref: etccore

    - name: Checkout submodules
      shell: bash
      run: |
        # If your submodules are configured to use SSH instead of HTTPS please uncomment the following line
        # git config --global url."https://github.com/".insteadOf "git@github.com:"
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --depth=1
        cd core-geth
        git fetch
        git fetch --tags
        # checkout_ref="$(git for-each-ref --count=1 --sort=-taggerdate --format '%(tag)' refs/tags)"
        # git checkout ${checkout_ref}
        checkout_ref="$(git for-each-ref --count=1 --sort=-committerdate --format '%(objectname)' refs/heads/master)"
        git checkout ${checkout_ref}
        make all
        echo "$(pwd)/build/bin" >> $GITHUB_PATH
        cd ..
        git diff --quiet || { git add core-geth && git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit --author='crawler <>' -m "ci update (core-geth:${checkout_ref}) $GITHUB_RUN_ID:$GITHUB_RUN_NUMBER"; }

    - name: Setup secrets
      run: |
        mkdir secrets
        echo "$ETH_DNS_DISCV4_KEY" > "$ETH_DNS_DISCV4_KEY_PATH"
        echo "$ETH_DNS_DISCV4_KEYPASS" > "$ETH_DNS_DISCV4_KEYPASS_PATH"

    - name: Check env and secrets
      run: |
        ./.ci/deps.sh
        export ETH_DNS_DISCV4_KEY_PUBLICINFO="$(cat $ETH_DNS_DISCV4_KEYPASS_PATH | ethkey inspect $ETH_DNS_DISCV4_KEY_PATH | grep -E '(Addr|Pub)')"
        echo "$ETH_DNS_DISCV4_KEY_PUBLICINFO"

    - name: Condense Classic (ETC) nodes list
      run: |
        cat \
          all.classic.blockd.info/nodes.json \
          all.mordor.blockd.info/nodes.json \
          | jq -s add \
          > all.json

    - name: Crawl
      run: |
        ./.ci/crawl.sh

    - name: Filter and sign
      run: |
        ./.ci/filter_and_sign.sh classic mordor

    - name: Deploy to DNS
      run: |
        ./.ci/deploy.sh classic mordor

    - name: Push
      run: |
        git config --local user.name 'github-actions[bot]'
        git config --local user.email 'github-actions[bot]@users.noreply.github.com'
        git push origin etccore

    # --- Parallel deploy to etcdisco.net ---
    - name: Filter and sign for etcdisco.net
      env:
        ETH_DNS_DISCV4_PARENT_DOMAIN: etcdisco.net
      run: ./.ci/filter_and_sign.sh classic mordor

    - name: Deploy to etcdisco.net DNS
      env:
        ETH_DNS_DISCV4_PARENT_DOMAIN: etcdisco.net
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_ETCDISCO }}
        ETH_DNS_CLOUDFLARE_ZONEID: ${{ secrets.ETH_DNS_CLOUDFLARE_ZONEID_ETCDISCO }}
      run: ./.ci/deploy.sh classic mordor

    - name: Push etcdisco.net changes
      run: git push origin etccore

    - name: Deploy GitHub Pages
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch origin gh-pages 2>/dev/null || { echo "gh-pages branch not found, skipping"; exit 0; }
        git show origin/gh-pages:generate.sh > /tmp/generate-pages.sh
        chmod +x /tmp/generate-pages.sh
        /tmp/generate-pages.sh

    - name: Alert on failure
      if: failure()
      env:
        AM_AUTH: ${{ secrets.ALERTMANAGER_BASICAUTH }}
        AM_URL: ${{ secrets.ALERTMANAGER_URL }}
        AM_LABELS: ${{ secrets.ALERTMANAGER_LABELS }}
      run: |
        if [ -z "$AM_AUTH" ] || [ -z "$AM_URL" ] || [ -z "$AM_LABELS" ]; then
          echo "alerting is not configured; skipping" >&2
          exit 0
        fi
        ends_at="$(date -u -d '+9 hours' +%Y-%m-%dT%H:%M:%SZ)"
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        jq -n \
          --argjson labels "$AM_LABELS" \
          --arg ends_at "$ends_at" \
          --arg run_url "$run_url" \
          --arg ref "$GITHUB_REF" \
          --arg sha "$GITHUB_SHA" \
          '[{
            labels: $labels,
            annotations: {
              summary: "Discv4 DNS crawler workflow failed",
              run: $run_url,
              ref: $ref,
              sha: $sha
            },
            endsAt: $ends_at
          }]' \
          | curl -sS --fail -u "$AM_AUTH" \
              -H 'Content-Type: application/json' \
              -X POST "$AM_URL" \
              -d @-
